# research-assistant-platform/docker-compose.yml
# Blueprint for all local infrastructure.
# "docker compose up -d" starts everything.
# "docker compose down" stops everything (data is preserved in volumes).
# "docker compose down -v" stops AND deletes all data (use for a clean reset).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432" # host:container – your app connects via localhost:5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
