name: Images

# Builds the three images the k3s deployment runs and pushes them to GHCR
# (private packages). Runs after CI succeeds on main, or by hand.
#
# WHY build in CI rather than on the server: compiling TypeScript and Vite on
# the shared 8 GB node would compete with Transcribe's Whisper worker.
#
# Tags: <commit sha> and `main`. Deploys never use tags, though: the k8s
# manifests pin images by digest (deploy/k8s, filled in by the deploy
# workflow), so each image's digest is written to the job summary and exposed
# as a job output.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/darunbjork

jobs:
  images:
    name: Build and push images
    # workflow_run fires for every CI completion; only build green pushes to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      backend-digest: ${{ steps.backend.outputs.digest }}
      migrator-digest: ${{ steps.migrator.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}

    steps:
      # workflow_run runs in the context of the default branch's latest commit;
      # build exactly the commit CI tested instead.
      - name: Resolve commit
        id: meta
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend (runtime target)
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/researchbot-backend:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/researchbot-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Migrator (migrator target)
        id: migrator
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/researchbot-migrator:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/researchbot-migrator:main
          # Shares the deps stage with the backend build.
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Web (Caddy + SPA)
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/researchbot-web:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/researchbot-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # The deploy workflow downloads this by run id and deploys ONLY these
      # digests (never a tag). Plain KEY=value lines: the deploy parses them
      # strictly, it never sources the file.
      - name: Write digests file
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          BACKEND: ${{ steps.backend.outputs.digest }}
          MIGRATOR: ${{ steps.migrator.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p digests
          printf 'SHA=%s\nBACKEND_DIGEST=%s\nMIGRATOR_DIGEST=%s\nWEB_DIGEST=%s\n' \
            "$SHA" "$BACKEND" "$MIGRATOR" "$WEB" > digests/digests.env
          cat digests/digests.env

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: digests/digests.env
          if-no-files-found: error
          # Redeploys/rollbacks by commit SHA need this artifact; older
          # commits must be rebuilt (run Images by hand) first.
          retention-days: 90

      - name: Summary
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          BACKEND: ${{ steps.backend.outputs.digest }}
          MIGRATOR: ${{ steps.migrator.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo "### Images for \`${SHA}\`"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${REGISTRY}/researchbot-backend\` | \`${BACKEND}\` |"
            echo "| \`${REGISTRY}/researchbot-migrator\` | \`${MIGRATOR}\` |"
            echo "| \`${REGISTRY}/researchbot-web\` | \`${WEB}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
