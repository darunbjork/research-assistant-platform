# TODO: This pipeline runs automatically on every push to main or develop,
# * and on every pull request targeting main.
#
# TODO: WHAT IT DOES:
# 1. Checks out your code on a fresh Ubuntu machine
# 2. Installs Node.js 20 with npm cache enabled (faster runs)
# 3. Installs exact dependencies from package-lock.json (npm ci, not npm install)
# 4. Runs every quality gate in sequence
# 5. If any step fails → the whole pipeline fails → GitHub shows a red X
# 6. Main branch is only ever green code

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Type Check · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Get the code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm dependencies — speeds up repeated runs significantly
          # GitHub caches the node_modules between runs
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # ── Step 3: Install dependencies ─────────────────────────────────────
      - name: Install dependencies
        working-directory: backend
        run: |
          # npm ci = "clean install"
          # Difference from npm install:
          #   npm install: may update package-lock.json
          #   npm ci:      uses EXACT versions from package-lock.json
          #                fails if package-lock.json is missing
          #                always deletes node_modules first (clean state)
          # CI/CD always uses npm ci for reproducible, deterministic installs.
          npm ci

      # ── Step 4: TypeScript type check ────────────────────────────────────
      - name: TypeScript type check
        working-directory: backend
        run: |
          echo "Checking for TypeScript errors..."
          npm run type-check
          echo "✅ Zero TypeScript errors"

      # ── Step 5: No-any check ─────────────────────────────────────────────
      - name: Zero-any enforcement
        working-directory: backend
        run: |
          echo "Scanning for 'any' types..."
          # This command returns exit code 1 if any ": any" is found
          # which causes the CI step to fail
          npm run no-any

      # ── Step 6: ESLint ───────────────────────────────────────────────────
      - name: Lint
        working-directory: backend
        run: |
          echo "Running ESLint..."
          npm run lint
          echo "✅ Zero lint warnings"

      # ── Step 7: Prettier ─────────────────────────────────────────────────
      - name: Formatting check
        working-directory: backend
        run: |
          echo "Checking code formatting..."
          npm run prettier:check
          echo "✅ All files formatted correctly"

      # ── Step 8: Tests ────────────────────────────────────────────────────
      - name: Run tests
        working-directory: backend
        run: |
          echo "Running test suite..."
          npm test
          echo "✅ All tests passed"

      # ── Step 9: Build ────────────────────────────────────────────────────
      - name: Build
        working-directory: backend
        run: |
          echo "Compiling TypeScript to JavaScript..."
          npm run build
          echo "✅ Build successful"

      # ── Step 10: Verify build output ─────────────────────────────────────
      - name: Verify build output
        working-directory: backend
        run: |
          echo "Verifying dist/ directory exists..."
          ls dist/
          # Check that app.js was compiled (the entry point)
          test -f dist/app.js && echo "✅ dist/app.js exists" || exit 1
