# .github/workflows/ci.yml
# Final production CI pipeline.
# All 9 steps must pass for a PR to merge.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER:     testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB:       rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:        postgresql://testuser:testpass@localhost:5432/rag_test
      REDIS_URL:           redis://localhost:6379
      GEMINI_API_KEY:      test-key-not-real
      JWT_SECRET:          test-secret-32-characters-minimum-abc
      JWT_REFRESH_SECRET:  test-refresh-32-characters-minimum-xyz
      NODE_ENV:            test

    steps:
      # ── Step 1: Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Node.js ─────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # ── Step 3: Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Step 4: TypeScript strict type check ──────────────────────────
      - name: Type check (strict)
        run: npm run type-check

      # ── Step 5: Zero any types ────────────────────────────────────────
      - name: Zero any types
        run: |
          FOUND=$(grep -rn '\bany\b' src --include='*.ts' 
            | grep -v '// eslint\|\.test\.ts\|mock\|__tests__' 
            | grep -v 'node_modules\|dist' || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Found 'any' types:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ Zero any types"

      # ── Step 6: ESLint ────────────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint

      # ── Step 7: Prettier format check ────────────────────────────────
      - name: Format check (Prettier)
        run: npx prettier --check "src/**/*.ts"

      # ── Step 8: Run Prisma migrations ────────────────────────────────
      - name: Run database migrations
        run: npx prisma migrate deploy

      # ── Step 9: Test with coverage ────────────────────────────────────
      - name: Test with coverage (80% threshold)
        run: npm run test:coverage

      # ── Step 10: Build TypeScript ─────────────────────────────────────
      - name: Build TypeScript
        run: npm run build

      # ── Step 11: Verify build output ─────────────────────────────────
      - name: Verify build output
        run: |
          if [ ! -f dist/app.js ]; then
            echo "❌ Build failed: dist/app.js not found"
            exit 1
          fi
          echo "✅ Build verified: dist/app.js exists"

      # ── Upload coverage report ────────────────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7
