apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
spec:
  # Migrations are forward-only; one retry covers a transient DB hiccup,
  # anything more needs a human.
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        # The image has no USER; run as `node` anyway, it only reads node_modules.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The `migrator` target of backend/Dockerfile: `npx prisma migrate deploy`.
          image: ghcr.io/darunbjork/researchbot-migrator
          env:
            # Only the connection string, not the app's API keys.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: researchbot-secrets
                  key: DATABASE_URL
            # npx and Prisma write caches under $HOME; the root FS is read-only.
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: NPM_CONFIG_UPDATE_NOTIFIER
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
