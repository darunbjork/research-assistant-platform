# deploy/k8s/base — ResearchBot's long-running workloads on the shared k3s
# cluster. Host-specific values live in overlays/voxcript; image digests live
# in components/images (filled in by the deploy workflow).
#
# Deliberately NOT in here:
#   - the Namespace: it already exists (created by the human) and the CI
#     deployer is namespace-scoped, so it can't manage a cluster-scoped object.
#   - any Secret: researchbot-secrets, r2-backup and ghcr-pull are created by
#     hand on the cluster and only referenced by name.
#   - the migrate Job: Jobs are immutable, so it lives in ../migrate and is
#     deleted and re-created before each rollout instead of being re-applied.
#   - the ResourceQuota: it limits this namespace, so the namespace must not
#     be able to change it (see ../admin, applied by the human).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: researchbot

labels:
  - pairs:
      app.kubernetes.io/part-of: researchbot
    # Selectors are immutable on Deployments/StatefulSets; keep them minimal.
    includeSelectors: false
    includeTemplates: true

# Two tiers, applied in order by the deploy workflow (scripts/k8s-deploy.sh):
#   data/  researchbot.io/tier=data — the ServiceAccount, NetworkPolicies,
#          the shared ConfigMap, postgres and redis. Applied first, so the
#          migrate Job has a database (and network access to it).
#   app/   researchbot.io/tier=app — backend, web, Ingress, TLS, monitoring,
#          dashboards and the backup CronJob. Applied after migrations.
# Rendering both together keeps ConfigMap hash references intact; the
# deploy selects a tier with `kubectl apply -l researchbot.io/tier=…`.
resources:
  - data
  - app
