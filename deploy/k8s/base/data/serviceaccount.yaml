# The namespace's default ServiceAccount already exists; applying this
# merges imagePullSecrets into it. WHY: the GHCR packages are private, and
# every pod here (backend, web, migrate) runs as `default`. The ghcr-pull
# Secret is created by hand on the cluster and never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: ghcr-pull
# No pod here talks to the Kubernetes API; don't mount a token by default.
automountServiceAccountToken: false
