# Data tier (researchbot.io/tier=data). See ../kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      researchbot.io/tier: data
    includeSelectors: false
    includeTemplates: false

resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - redis.yaml

configMapGenerator:
  # Non-secret runtime config for the backend (envFrom) and a few keys read
  # individually by postgres and web. The hash suffix makes a config change
  # roll the pods that use it.
  - name: researchbot-config
    literals:
      - NODE_ENV=production
      - PORT=3001
      # Traefik is the only proxy in front of /api and /ws.
      - TRUST_PROXY_HOPS=1
      - ALLOW_REGISTRATION=true
      - GLOBAL_DAILY_LLM_CALLS_MAX=2000
      - LOG_LEVEL=info
      # Voice providers stay mocked until the spend-cap checklist in
      # docs/cost.md is done; flip these in the overlay, not here.
      - VOICE_MOCK=true
      - DEEPGRAM_MODEL=nova-3
      - TTS_PROVIDER=mock
      - TTS_MAX_CHARS=600
      - TTS_DAILY_CHARS_PER_USER=20000
      - ELEVENLABS_MODEL_ID=eleven_flash_v2_5
      - ELEVENLABS_OUTPUT_FORMAT=pcm_24000
      - POSTGRES_USER=rag
      - POSTGRES_DB=ragdb
      # Set per environment in the overlay.
      - CORS_ORIGINS=https://research.example.com
      - DOMAIN=research.example.com
