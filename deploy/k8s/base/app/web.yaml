apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Caddy listens on 8080, so it runs as an unprivileged user with no
        # capabilities (binding :80 would need CAP_NET_BIND_SERVICE).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/darunbjork/researchbot-web
          ports:
            - name: http
              containerPort: 8080
          env:
            # k3s mode of deploy/Caddyfile: plain HTTP behind Traefik, which
            # terminates TLS and sends HSTS. This Caddy only serves the SPA.
            - name: SITE_ADDRESS
              value: ":8080"
            - name: HSTS
              value: "off"
            # Still needed: the CSP names wss://<domain>.
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: researchbot-config
                  key: DOMAIN
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Caddy's XDG_DATA_HOME / XDG_CONFIG_HOME in the official image.
            # Nothing durable is stored (no certificates in this mode).
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: config
          emptyDir:
            sizeLimit: 16Mi
