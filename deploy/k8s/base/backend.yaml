apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    # Named: the ServiceMonitor scrapes this port by name.
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  # Exactly one replica. WebSocket sessions and agent run state live in the
  # process, so a second replica would need sticky sessions and shared state:
  # out of scope (K3S plan). Don't scale this up.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new pod before stopping the old one: no gap in service.
      # NOTE: this briefly runs two backends, so the namespace ResourceQuota
      # must leave room for a second backend's limits (see ../admin).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      # 5 s preStop + 25 s app shutdown timer (lifecycle/shutdown.ts,
      # SHUTDOWN_FALLBACK_MS) + 5 s margin before SIGKILL.
      terminationGracePeriodSeconds: 35
      securityContext:
        # The image's `node` user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/darunbjork/researchbot-backend
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: researchbot-config
            # Created by hand from .env.production (never committed).
            - secretRef:
                name: researchbot-secrets
          # /health checks Postgres and Redis and returns 503 while shutting
          # down, which is exactly what readiness should mean: stop routing
          # traffic here.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness deliberately does NOT use /health: a Postgres or Redis
          # blip would otherwise restart a healthy process, dropping every
          # WebSocket session. /livez (routes/livez.routes.ts) touches no
          # dependency and stays 200 while draining. Unlike a bare TCP check,
          # it also catches a wedged event loop.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # Gives startup (env validation, DB/Redis connect) up to 60 s before
          # liveness starts counting.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Traefik needs a moment to see the pod leave the endpoints; keep
            # serving for 5 s before SIGTERM starts the graceful shutdown.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The production logger writes rotating files under /app/logs
            # (utils/logger.ts); stdout still carries every line for kubectl logs.
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
