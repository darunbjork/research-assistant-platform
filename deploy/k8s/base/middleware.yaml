# Traefik Middlewares, referenced from the Ingress annotations as
# researchbot-<name>@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    # HSTS moved here from Caddy: Traefik is the TLS edge on k3s, and this
    # covers /api, /ws and /health too, not only the SPA.
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  # 12 MiB: just above the backend's 10 MB upload limit (multer), so an
  # oversized upload is refused at the edge before it reaches the pod.
  # Only attached to /api: the buffering middleware holds the request, which
  # must never sit in front of the /ws WebSocket upgrade.
  buffering:
    maxRequestBodyBytes: 12582912
    memRequestBodyBytes: 2097152
