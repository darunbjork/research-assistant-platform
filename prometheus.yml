# prometheus.yml
# Prometheus scrape configuration for the Research Assistant Platform.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "research-assistant-backend"
    static_configs:
      - targets: ["host.docker.internal:3001"]
    metrics_path: "/metrics"
    scrape_interval: 10s